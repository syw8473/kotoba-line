<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ことば線 JLPT</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: 一條垂直的電車路線圖，N5→N1 是不同顏色的路線，每一課是一個「站」，完成就蓋車站印章 */
:root{
  --bg:#edf1f2; --surface:#ffffff; --surface-2:#f4f7f8; --ink:#16212e; --muted:#5b6876; --rule:#d3dbe0;
  --line:#2f9e5b; --line-press:#227844; --line-ink:#ffffff; --line-soft:#dcefe3;
  --stamp:#c43d33; --good:#2b8f52; --good-soft:#dff1e6; --bad:#c9443a; --bad-soft:#fbe4e1; --bad-press:#9c3029;
  --gold:#d99a00; --heart:#e0475b; --locked:#a9b4bd;
  --n4:#2f86c9; --n3:#d4a000; --n2:#e0731f; --n1:#c23a5a;
  --f-jp:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Noto Sans JP",sans-serif;
  --f-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --r:14px;
  --bot-body:#f6f9f8; --bot-line:#2b3a4a; --bot-visor:#1d2a3a; --bot-eye:#5ef2cf; --bot-accent:#7fd8b0; --bot-blush:#ff9fb2;
  --baby-skin:#fde4d2; --baby-line:#6b4636; --baby-hair:#3a2a22; --baby-eye:#1f1a1c; --baby-blush:#ff9aa8; --baby-lip:#f0a0a4; --baby-mouth:#9b3d45; --baby-cloth:#ffffff; --baby-star:#2c3a5a;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f151c; --surface:#18212b; --surface-2:#1f2a36; --ink:#e6edf2; --muted:#94a2af; --rule:#2c3946;
  --line:#3fb870; --line-press:#2a8a52; --line-ink:#06140c; --line-soft:#1b3a28;
  --stamp:#e8675c; --good:#4cc47f; --good-soft:#163424; --bad:#ef6d62; --bad-soft:#3b1d1b; --bad-press:#b74b42;
  --gold:#f2bd2c; --heart:#ff6b7d; --locked:#55636f; color-scheme:dark;
  --bot-body:#e4ece9; --bot-line:#0e1822; --bot-visor:#16212c; --baby-line:#2a1a14; --baby-cloth:#f1f3f6;
}}
:root[data-theme="dark"]{
  --bg:#0f151c; --surface:#18212b; --surface-2:#1f2a36; --ink:#e6edf2; --muted:#94a2af; --rule:#2c3946;
  --line:#3fb870; --line-press:#2a8a52; --line-ink:#06140c; --line-soft:#1b3a28;
  --stamp:#e8675c; --good:#4cc47f; --good-soft:#163424; --bad:#ef6d62; --bad-soft:#3b1d1b; --bad-press:#b74b42;
  --gold:#f2bd2c; --heart:#ff6b7d; --locked:#55636f; color-scheme:dark;
  --bot-body:#e4ece9; --bot-line:#0e1822; --bot-visor:#16212c; --baby-line:#2a1a14; --baby-cloth:#f1f3f6;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{min-height:100vh;min-height:100dvh;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.jp{font-family:var(--f-jp)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--n4);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding-block:20px 48px;display:flex;flex-direction:column;gap:22px}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{font-family:var(--f-jp);font-weight:900;font-size:26px;margin:0;letter-spacing:.02em}
.brand span{font-size:12px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}
.stats{display:flex;gap:8px}
.chip{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--rule);border-radius:999px;padding:4px 12px;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.chip svg{width:16px;height:16px}

/* daily goal */
.goal{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px;display:flex;align-items:center;gap:14px}
.goal-txt{flex:1;min-width:0}
.goal-txt b{display:block;font-size:14px}
.goal-txt small{color:var(--muted);font-size:13px}
.bar{height:10px;background:var(--surface-2);border-radius:99px;overflow:hidden;border:1px solid var(--rule)}
.bar i{display:block;height:100%;background:var(--gold);border-radius:99px;transition:width .4s ease}

/* level tabs */
.levels{display:flex;gap:8px;flex-wrap:wrap}
.lv{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:10px;background:var(--surface);border:1px solid var(--rule);font-weight:700;font-size:13px}
.lv .num{display:grid;place-items:center;width:30px;height:30px;border-radius:7px;color:#fff;font-family:var(--f-jp);font-weight:900;font-size:13px}
.lv[aria-disabled="true"]{color:var(--muted);cursor:default}
.lv[aria-disabled="true"] .num{opacity:.45}
.lv.on{border-color:var(--line);box-shadow:0 0 0 2px var(--line-soft)}

/* route map */
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:0 0 -8px}
.section-h h2{font-size:17px;margin:0}
.section-h small{color:var(--muted);font-size:13px}
.route{list-style:none;margin:0;padding:0;position:relative;display:flex;flex-direction:column;gap:14px}
.route::before{content:"";position:absolute;left:27px;top:28px;bottom:28px;width:8px;border-radius:8px;background:var(--line);opacity:.9}
.station{display:grid;grid-template-columns:62px 1fr;gap:10px;align-items:center;position:relative}
.dot{width:62px;height:62px;display:grid;place-items:center;position:relative;z-index:1}
.dot i{width:30px;height:30px;border-radius:50%;background:var(--surface);border:6px solid var(--line);display:grid;place-items:center}
.station.done .dot i{background:var(--line)}
.station.done .dot i svg{width:14px;height:14px;color:var(--line-ink)}
.station.current .dot i{width:42px;height:42px;border-width:7px}
.station.current .dot::after{content:"";position:absolute;inset:6px;border-radius:50%;border:3px solid var(--line);animation:pulse 1.8s ease-out infinite}
.station.locked .dot i{border-color:var(--locked)}
@keyframes pulse{from{transform:scale(.8);opacity:.9}to{transform:scale(1.25);opacity:0}}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:12px 14px;display:flex;align-items:center;gap:12px;min-width:0}
.station.current .card{border-color:var(--line);box-shadow:0 0 0 3px var(--line-soft)}
.code{flex:0 0 auto;width:44px;border:3px solid var(--line);border-radius:8px;text-align:center;line-height:1.05;padding:3px 0;background:var(--surface)}
.code small{display:block;font-size:10px;font-weight:700;color:var(--line)}
.code b{font-family:var(--f-jp);font-size:18px;font-weight:900}
.station.locked .code{border-color:var(--locked)}
.station.locked .code small{color:var(--muted)}
.meta{flex:1;min-width:0}
.meta b{display:block;font-size:15px;line-height:1.35}
.meta small{color:var(--muted);font-size:12.5px}
.station.locked .meta{color:var(--muted)}
.meta .mn{display:inline-block;margin-top:3px;font-size:11px;font-weight:700;color:var(--n4);border:1px solid color-mix(in srgb,var(--n4) 40%,transparent);border-radius:5px;padding:0 6px;letter-spacing:.02em}

.btn{border:0;border-radius:12px;padding:10px 18px;font-weight:700;font-size:15px;background:var(--line);color:var(--line-ink);box-shadow:0 4px 0 var(--line-press);transition:transform .06s,box-shadow .06s;white-space:nowrap}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--line-press)}
.btn:disabled{background:var(--surface-2);color:var(--muted);box-shadow:0 4px 0 var(--rule);cursor:default}
.btn.ghost{background:var(--surface);color:var(--ink);border:2px solid var(--rule);box-shadow:0 4px 0 var(--rule)}
.btn.bad{background:var(--bad);color:#fff;box-shadow:0 4px 0 var(--bad-press)}
.btn.wide{width:100%;padding:14px;font-size:16px}
.lock-tag{font-size:12px;color:var(--muted);white-space:nowrap}

/* stamp book */
.stamps{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:12px 8px}
.sec{display:flex;flex-direction:column;gap:12px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-left:4px}
.sec-h h3{margin:0;font-size:15px}
.sec-h small{color:var(--muted);font-size:12.5px}
.btn.small{padding:6px 12px;font-size:13px;box-shadow:0 3px 0 var(--rule)}
.stamp-slot{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted);text-align:center}
.stamp{width:100%;max-width:58px;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-family:var(--f-jp);font-weight:900;font-size:22px}
.stamp.empty{border:2px dashed var(--rule);color:var(--rule)}
.stamp.got{color:var(--stamp);border:3px double var(--stamp);transform:rotate(-8deg);background:color-mix(in srgb,var(--stamp) 7%,transparent)}

.review{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px;display:flex;align-items:center;gap:12px}
.review .meta small{display:block}
.review.talk{border-color:color-mix(in srgb,var(--n1) 45%,var(--rule))}
.tog{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:13px;color:var(--muted);cursor:pointer}
.tog input{width:16px;height:16px;accent-color:var(--line)}
.mic-wrap{display:flex;flex-direction:column;align-items:center;gap:12px;padding-block:8px}
.mic{width:96px;height:96px;border-radius:50%;border:0;background:var(--n1);color:#fff;display:grid;place-items:center;box-shadow:0 5px 0 color-mix(in srgb,var(--n1) 65%,#000);position:relative}
.mic svg{width:44px;height:44px}
.mic.on::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:4px solid var(--n1);animation:pulse 1.2s ease-out infinite}
.lvl{width:140px;height:8px;border-radius:99px;background:var(--surface-2);border:1px solid var(--rule);overflow:hidden}
.lvl i{display:block;height:100%;width:0;background:var(--n1);border-radius:99px;transition:width .08s linear}
.mic-status{margin:0;color:var(--muted);text-align:center;font-size:15px;min-height:1.6em;max-width:36em}
.mic-status .jp{color:var(--ink);font-weight:700}
.tip{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:10px;font-size:16px;line-height:1.7}
.tip p{margin:0}
.tip b{color:var(--line)}
/* 重點講解 */
.sec-btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.guide .gt{flex:1;min-width:0;display:flex;flex-direction:column}
.guide .gt b{font-size:17px}
.guide .gt small{color:var(--muted);font-size:12.5px;line-height:1.5}
.gtoc{display:flex;gap:6px;flex-wrap:wrap}
.gtoc button{border:1px solid var(--rule);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700}
.gcard{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:10px;font-size:15.5px;line-height:1.75;scroll-margin-top:12px}
.gcard h3{margin:0;font-size:18px}
.gcard h4{margin:6px 0 0;font-size:14px;color:var(--muted);letter-spacing:.04em}
.gcard p{margin:0}
.gcard .note,.gsub{font-size:13.5px;color:var(--muted)}
.gcard b{color:var(--line)}
.gcard .mn{display:inline-block;margin-top:2px;font-size:11px;font-weight:700;color:var(--n4);border:1px solid color-mix(in srgb,var(--n4) 40%,transparent);border-radius:5px;padding:0 6px}
.gtop{display:flex;gap:10px;align-items:center}
.gno{flex:0 0 auto;width:32px;height:32px;border-radius:50%;background:var(--line);color:var(--line-ink);display:grid;place-items:center;font-weight:900}
.gform{display:flex;flex-direction:column;gap:2px;background:var(--line-soft);border-radius:12px;padding:10px 14px}
.gform b{font-size:21px;color:var(--ink)}
.gform span{font-size:14px;color:var(--muted)}
.gp{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.gex,.gbad,.vlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.gex li,.vlist li{display:flex;align-items:center;gap:10px;background:var(--surface-2);border-radius:10px;padding:8px 10px}
.gex li>div{flex:1;min-width:0;display:flex;flex-direction:column}
.gex .jp{font-size:17px}
.gex small,.gbad small{color:var(--muted);font-size:13px}
.gbad li{background:var(--surface-2);border-radius:10px;padding:8px 12px}
.gbad li>div{display:flex;flex-direction:column;gap:2px}
.x-w{color:var(--bad)}
.x-w b{color:var(--bad)}
.x-r{color:var(--good)}
.x-r b{color:var(--good)}
.gtip{background:color-mix(in srgb,var(--gold) 14%,transparent);border-radius:10px;padding:8px 12px;font-size:14.5px}
.say{flex:0 0 auto;width:34px;height:34px;border-radius:10px;border:0;background:var(--n4);color:#fff;display:inline-grid;place-items:center;vertical-align:middle}
.say svg{width:18px;height:18px}
.vlist .vw{flex:1;min-width:0;font-size:18px}
.vlist .vz{color:var(--muted);font-size:14px}
.kgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.kc{border:1px solid var(--rule);background:var(--surface-2);border-radius:10px;padding:6px 0;display:flex;flex-direction:column;align-items:center;line-height:1.2}
.kc b{font-size:22px;color:var(--ink)}
.kc small{font-size:11px;color:var(--muted)}
.kc.empty{border:0;background:none}
.gcard.sum{border-color:var(--line)}

.my-rec{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;max-width:360px}
.my-rec-row{display:flex;align-items:center;gap:8px;width:100%;font-size:13px;color:var(--muted)}
.my-rec-row span{flex:0 0 auto}
.my-rec audio{flex:1;min-width:0;height:36px}
.show .hl,.fb .hl{color:var(--line);text-decoration:underline 3px;text-underline-offset:6px}
.tip .eg{font-family:var(--f-jp);font-size:17px;background:var(--surface-2);border-radius:10px;padding:8px 12px}
.tip .note{font-size:14px;color:var(--muted)}
.tip-scroll{overflow-x:auto}
.tip-t{border-collapse:collapse;width:100%;font-size:15px;min-width:280px}
.tip-t th,.tip-t td{border:1px solid var(--rule);padding:6px 10px;text-align:left;vertical-align:top}
.tip-t th{background:var(--surface-2);font-size:13px;color:var(--muted)}
.tip-t td{font-family:var(--f-jp)}
.fb .ans,.mic-status{line-height:2.1}
.fb .ans ruby rt,.mic-status ruby rt{font-size:.6em;color:var(--muted)}
.diff{font-size:14px;color:var(--muted)}
.diff .jp{font-size:18px;color:var(--ink);letter-spacing:.04em}
.diff mark{background:color-mix(in srgb,var(--gold) 40%,transparent);color:inherit;border-radius:3px;padding:0 1px}
.foot{color:var(--muted);font-size:12px;text-align:center}

/* lesson overlay */
.lesson{position:fixed;inset:0;height:100vh;height:100dvh;background:var(--bg);display:flex;flex-direction:column;z-index:20;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.l-head,.l-body,.l-foot-in{width:100%;max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.l-head{display:flex;align-items:center;gap:14px;padding-block:16px 8px}
.x{background:none;border:0;padding:6px;border-radius:8px;color:var(--muted);display:grid;place-items:center}
.x svg{width:22px;height:22px}
.prog{flex:1;height:14px;border-radius:99px;background:var(--surface-2);border:1px solid var(--rule);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--line);border-radius:99px;transition:width .35s ease}
.hearts{display:flex;align-items:center;gap:4px;font-weight:700;color:var(--heart);font-variant-numeric:tabular-nums}
.hearts svg{width:22px;height:22px}
.l-body{flex:1;overflow-y:auto;padding-block:16px 24px;display:flex;flex-direction:column;gap:20px}
.prompt{font-size:20px;font-weight:700;margin:0;text-wrap:balance}
.show{display:flex;align-items:center;justify-content:center;gap:14px;padding:18px;background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);flex-wrap:wrap;text-align:center}
.show .big{font-family:var(--f-jp);font-size:84px;font-weight:700;line-height:1.1}
.show .latin{font-family:var(--f-ui);font-size:56px;font-weight:700;line-height:1.1;letter-spacing:.04em}
.show .word{font-family:var(--f-jp);font-size:38px;font-weight:700;line-height:1.5}
.show .word.zh{font-family:var(--f-ui);font-size:32px}
.show .sent{font-family:var(--f-jp);font-size:26px;font-weight:700;line-height:1.6}
.show .sub{flex-basis:100%;color:var(--muted);font-size:14px}
ruby rt{font-size:.42em;color:var(--muted);font-weight:500}
.blank{display:inline-block;min-width:2.2em;border-bottom:3px solid var(--line);margin:0 .15em;color:transparent}
.spk{width:52px;height:52px;border-radius:14px;border:0;background:var(--n4);color:#fff;display:grid;place-items:center;box-shadow:0 4px 0 color-mix(in srgb,var(--n4) 70%,#000)}
.spk svg{width:26px;height:26px}
.spk.big{width:96px;height:96px;border-radius:24px}
.spk.big svg{width:46px;height:46px}
.spk.slow{width:52px;height:52px;background:var(--surface);color:var(--n4);border:2px solid var(--rule);box-shadow:0 4px 0 var(--rule);font-weight:700;font-size:12px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opts.one{grid-template-columns:1fr}
.opt{background:var(--surface);border:2px solid var(--rule);border-radius:14px;padding:14px 12px;font-size:18px;font-weight:700;box-shadow:0 4px 0 var(--rule);display:flex;align-items:center;gap:10px;text-align:left;min-height:62px;min-width:0}
.opt .k{flex:0 0 auto;width:24px;height:24px;border-radius:6px;border:1.5px solid var(--rule);display:grid;place-items:center;font-size:12px;color:var(--muted);font-family:var(--f-ui)}
.opt .t{flex:1;min-width:0;text-align:center}
.opt.jp .t{font-family:var(--f-jp);font-size:22px}
.opt[aria-pressed="true"]{border-color:var(--n4);background:color-mix(in srgb,var(--n4) 10%,var(--surface));box-shadow:0 4px 0 var(--n4)}
.opt[aria-pressed="true"] .k{border-color:var(--n4);color:var(--n4)}
.opt:disabled{cursor:default}
.answer-input{width:100%;font:inherit;font-size:22px;padding:14px 16px;border-radius:14px;border:2px solid var(--rule);background:var(--surface);color:var(--ink)}
.bubble{display:flex;gap:12px;align-items:flex-start}
.bubble .who{flex:0 0 auto;width:52px;height:52px;border-radius:50%;background:var(--line-soft);display:grid;place-items:center;font-family:var(--f-jp);font-weight:900;color:var(--line);font-size:20px}
.bubble p{margin:0;background:var(--surface);border:1px solid var(--rule);border-radius:4px 14px 14px 14px;padding:12px 14px;font-size:18px;font-weight:500}
.tray{min-height:120px;border-top:2px solid var(--rule);border-bottom:2px solid var(--rule);padding-block:12px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{background:var(--surface);border:2px solid var(--rule);border-radius:12px;padding:8px 14px;font-family:var(--f-jp);font-size:20px;font-weight:700;box-shadow:0 3px 0 var(--rule)}
.tile.used{background:var(--surface-2);color:transparent;box-shadow:none;cursor:default}
.match{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.match .col{display:flex;flex-direction:column;gap:10px}
.match .opt{justify-content:center;height:62px;min-height:0}
.match .opt.done{opacity:.35;border-style:dashed;box-shadow:none}
.match .opt.wrong{border-color:var(--bad);animation:shake .3s}

function addFuri(w,r){

  while(i<t.length){

function lev(a,b){const m=a.length,n=b.length;if(!m||!n)return Math.max(m,n);let p=[...Array(n+1).keys()];for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
function scoreSpeech(q,alts){
  let best=0,bx='',by='';
  for(const a of alts){const x=norm(toKana(a));if(!x)continue;
    for(const t of q.accepts){const y=norm(toKana(t));if(!y)continue;
      let s=1-lev(x,y)/Math.max(x.length,y.length);
      if(y.length===1&&x.length&&[...x].every(c=>c===y))s=1;
      if(y.length>=2&&x.includes(y))s=1; /* 多聽到前後的字（例如「こどもです」）也算對 */
      if(s>best||!by){best=Math.max(best,s);bx=x;by=y}}}

  const len=norm(q.speak||q.accepts[0]||'').length; /* 用假名讀音的長度判斷長短 */

function markDiff(target,heard){
  const a=[...target],b=[...heard],m=a.length,n=b.length;
  const d=Array.from({length:m+1},()=>new Array(n+1).fill(0));
  for(let i=m-1;i>=0;i--)for(let j=n-1;j>=0;j--)d[i][j]=a[i]===b[j]?d[i+1][j+1]+1:Math.max(d[i+1][j],d[i][j+1]);

  while(i<m){if(j<n&&a[i]===b[j]){out+=esc(a[i]);i++;j++}else if(j<n&&d[i][j+1]>=d[i+1][j]){j++}else{out+=`<mark>${esc(a[i])}</mark>`;i++}}

function listen(onUpdate,onDone,onLevel,onStage){
  /* 持續聽：講完後安靜 1.5 秒才停，最長 10 秒；同時量麥克風音量，讓人看得到有沒有收到聲音 */
  let alts=[],err=null,r,silT=null,maxT=null,stream=null,ac=null,raf=0,ended=false,heardAny=false,metered=false;
  try{r=new SR()}catch(e){onDone([],'unsupported',{});return null}
  r.lang='ja-JP';r.interimResults=true;r.maxAlternatives=5;r.continuous=true;
  const halt=()=>{try{r.stop()}catch(e){}};
  const stopSoon=ms=>{clearTimeout(silT);silT=setTimeout(halt,ms)};
  r.onresult=e=>{
    const res=[...e.results];
    const n=Math.max(...res.map(x=>x.length));
    alts=[];for(let k=0;k<n;k++)alts.push(res.map(x=>(x[k]||x[0]).transcript).join(''));alts=alts.filter(a=>a.trim());
    onUpdate(alts[0]||'',res.every(x=>x.isFinal));
    stopSoon(1500);
  };
  r.onerror=e=>{err=e.error};
  if(onStage){r.onaudiostart=()=>onStage('audio');r.onsoundstart=()=>onStage('sound');r.onspeechstart=()=>onStage('speech')}
  r.onend=()=>{
    if(ended)return;ended=true;
    clearTimeout(silT);clearTimeout(maxT);cancelAnimationFrame(raf);
    if(stream)stream.getTracks().forEach(t=>t.stop());if(ac)ac.close().catch(()=>{});
    if(onLevel)onLevel(0);
    onDone(alts,err,{heardAny,metered});
  };
  maxT=setTimeout(halt,10000);
  if(onLevel&&navigator.mediaDevices&&navigator.mediaDevices.getUserMedia){
    navigator.mediaDevices.getUserMedia({audio:true}).then(st=>{
      if(ended){st.getTracks().forEach(t=>t.stop());return}
      stream=st;metered=true;ac=new (window.AudioContext||window.webkitAudioContext)();
      const an=ac.createAnalyser();an.fftSize=512;ac.createMediaStreamSource(st).connect(an);
      const buf=new Uint8Array(an.fftSize);
      const tick=()=>{an.getByteTimeDomainData(buf);let m=0;for(const v of buf)m=Math.max(m,Math.abs(v-128));
        const lv=Math.min(1,m/48);if(lv>.12)heardAny=true;onLevel(lv);raf=requestAnimationFrame(tick)};
      tick();
    }).catch(()=>{});
  }
  try{if(canSpeak)speechSynthesis.cancel();r.start()}catch(e){ended=true;onDone([],'start',{})}
  return r;
}

function choiceQ({kind='choice',prompt,show,correct,pool,speak,jpOpts=false}){
  const others=sample(pool.filter(p=>p.key!==correct.key),3);
  const options=shuffle([correct,...others]);
  return {type:kind,prompt,show,speak,jpOpts,options:options.map(o=>o.html),answer:options.findIndex(o=>o.key===correct.key)};
}

function buildKana(items){
  const optR=items.map(i=>({key:i.r,html:i.r})), optK=items.map(i=>({key:i.k,html:i.k}));
  const qs=[];
  sample(items,4).forEach(i=>qs.push(choiceQ({prompt:'這個假名怎麼唸？',show:{html:i.k,cls:'big'},speak:i.k,correct:{key:i.r,html:i.r},pool:optR})));
  sample(items,3).forEach(i=>qs.push(choiceQ({kind:'listen',prompt:'聽聽看，是哪一個假名？',speak:i.k,correct:{key:i.k,html:i.k},pool:optK,jpOpts:true})));
  sample(items,2).forEach(i=>qs.push(choiceQ({prompt:'選出對應的假名',show:{html:i.r,cls:'latin'},correct:{key:i.k,html:i.k},pool:optK,jpOpts:true})));
  sample(items,2).forEach(i=>qs.push({type:'type',prompt:'輸入這個假名的羅馬拼音',show:{html:i.k,cls:'big'},speak:i.k,accept:[i.r,...(ALT[i.r]||[])],answerHtml:i.r}));

  return shuffle(qs);
}

function buildVocab(items){

function buildGrammar({sents,fills,vocab}){
  const qs=[];
  const pool=[...new Set(sents.flatMap(s=>s.jp).concat(['を','に','が','も','ここ','ほん']))];
  sents.forEach(s=>{
    const extra=sample(pool.filter(t=>!s.jp.includes(t)),2);
    qs.push({type:'arrange',prompt:'把這句話翻成日文',zh:s.zh,tokens:s.jp,accept:[s.jp,...s.alts].map(t=>t.join('')),bank:shuffle([...s.jp,...extra]),answerHtml:s.jp.join(' '),altHtml:s.alts.map(t=>t.join(' '))});
  });
  const optS=sents.map(s=>({key:s.zh,html:s.zh}));
  sample(sents,2).forEach(s=>qs.push(choiceQ({kind:'listen',prompt:'聽聽看，這句話是什麼意思？',speak:s.jp.join(''),correct:{key:s.zh,html:s.zh},pool:optS})));
  fills.forEach(f=>{
    const opts=shuffle(f.opts);
    qs.push({type:'choice',prompt:'空格要填什麼？',jpOpts:true,
      show:{html:`${f.before}<span class="blank">＿</span>${f.after}`,cls:'sent',sub:f.zh},
      speak:f.before+f.ans+f.after,options:opts,answer:opts.indexOf(f.ans)});
  });
  const optZh=vocab.map(i=>({key:i.zh,html:i.zh}));
  sample(vocab,2).forEach(i=>qs.push(choiceQ({prompt:'這是什麼意思？',show:{html:rb(i),cls:'word'},speak:i.r,correct:{key:i.zh,html:i.zh},pool:optZh})));
  qs.push({type:'match',prompt:'把日文和中文配對',pairs:sample(vocab,4).map(i=>[rb(i),i.zh]),jpLeft:true});
  sample(sents,2).forEach(s=>qs.push(speakSentQ(s)));
  return shuffle(qs);
}

function buildVerbGroups(){

function buildPlain(cfg,conj){
  const base=buildGrammar(cfg);
  const extra=conj.flatMap(([from,to,n])=>sample(VERBS,n).map(v=>conjQ(v,from,to)));
  const speaks=base.filter(q=>q.type==='speak');
  const rest=shuffle([...base.filter(q=>q.type!=='speak'),...extra]).slice(0,13);
  return shuffle([...rest,...speaks]);
}

/* ---------- 雲端存檔：從 Claude 連結開時，進度存在 Sungyi 的 Claude 帳號（電腦、手機都同步）；開本機檔案時只用瀏覽器存檔 ---------- */
let cloudRef=null,cloudBusy=false,cloudAgain=false;
function cloudPush(){
  if(!cloudRef)return;
  if(cloudBusy){cloudAgain=true;return}
  cloudBusy=true;
  cloudRef.set({state:JSON.stringify(S),savedAt:S.savedAt||Date.now()})
    .catch(()=>{}).finally(()=>{cloudBusy=false;if(cloudAgain){cloudAgain=false;cloudPush()}});
}
function mergeProgress(a,b){ /* 兩份進度合併：過站取聯集，其他取比較新的那份 */
  const newer=(b.savedAt||0)>(a.savedAt||0)?b:a, older=newer===a?b:a;
  const out=Object.assign({},older,newer);
  out.done=Object.assign({},older.done||{},newer.done||{});
  Object.keys(out.done).forEach(k=>{const x=(a.done||{})[k],y=(b.done||{})[k];if(x&&y)out.done[k]=x.date<=y.date?x:y});
  out.xp=Math.max(a.xp||0,b.xp||0);
  return out;
}
(async()=>{
  try{
    if(!window.claude||!window.claude.use)return;
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!db||!user)return;
    const uid=await user.id();if(!uid)return;
    const ref=db.doc('data/users/'+uid+'/progress');
    const snap=await ref.get();
    const before=JSON.stringify(S);
    if(snap.exists){const d=snap.data();if(d&&typeof d.state==='string'){try{S=mergeProgress(S,JSON.parse(d.state))}catch(e){}}}
    cloudRef=ref;
    try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
    if(!snap.exists||JSON.stringify(S)!==(snap.data()||{}).state)cloudPush();
    if(JSON.stringify(S)!==before&&!L&&typeof renderHome==='function')renderHome();
  }catch(e){}
})();

/* ---------- speech ---------- */
const canSpeak=typeof window.speechSynthesis!=='undefined'&&typeof window.SpeechSynthesisUtterance!=='undefined';
let jaVoice=null;
/* 優先用 Kyoko（高品質版本優先），沒有的話用 Google 日本語，再不然用第一個日文語音 */
function pickVoice(){try{
  const ja=speechSynthesis.getVoices().filter(v=>/^ja/i.test(v.lang));
  const rank=v=>/kyoko/i.test(v.name)?(/premium|enhanced|高品質|加強/i.test(v.name)?0:1):/google/i.test(v.name)?2:3;
  jaVoice=ja.sort((a,b)=>rank(a)-rank(b))[0]||null;
}catch(e){}}
if(canSpeak){pickVoice();try{speechSynthesis.onvoiceschanged=pickVoice}catch(e){}}
function speak(t,rate=.9){if(!canSpeak||!t)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ja-JP';if(jaVoice)u.voice=jaVoice;u.rate=rate;speechSynthesis.speak(u)}catch(e){}}

/* ---------- sound effects（Web Audio 即時合成，不用音檔） ---------- */
let AC=null;
const soundOn=()=>S.sound!==false;
function tone(f,t0,dur,type='triangle',vol=.18){
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f,AC.currentTime+t0);
  g.gain.setValueAtTime(0,AC.currentTime+t0);
  g.gain.linearRampToValueAtTime(vol,AC.currentTime+t0+.015);
  g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+t0+dur);
  o.connect(g).connect(AC.destination);o.start(AC.currentTime+t0);o.stop(AC.currentTime+t0+dur+.05);
}
function sfx(kind){
  if(!soundOn())return;
  try{
    if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')AC.resume();
    if(kind==='ok'){tone(784,0,.12);tone(1175,.09,.28)}
    else if(kind==='no'){tone(196,0,.16,'square',.07);tone(165,.13,.26,'square',.07)}
    else if(kind==='pop'){tone(988,0,.08,'sine',.12)}
    else if(kind==='win'){[523,659,784,1047].forEach((f,i)=>tone(f,i*.11,.22));tone(1319,.5,.5,'triangle',.16)}
    else if(kind==='lose'){[392,330,262].forEach((f,i)=>tone(f,i*.16,.3,'sine',.12))}
  }catch(e){}
}

/* ---------- lesson engine ---------- */
let L=null;
const mkey=q=>[q.type,q.show?.html||'',q.speak||'',q.zh||'',q.pairs?JSON.stringify(q.pairs):''].join('|');

function startLesson(id){
  let lesson,qs;
  if(id==='review'){
    lesson={id:'review',title:'錯題複習'};
    qs=sample(S.mistakes,Math.min(10,S.mistakes.length)).map(q=>JSON.parse(JSON.stringify(q)));
    qs.forEach(q=>{if(q.options){const c=q.options[q.answer];q.options=shuffle(q.options);q.answer=q.options.indexOf(c)}});
  }else if(id.startsWith('skip:')){
    const sec=SECTIONS.find(s=>s.id===id.slice(5));
    const upto=LESSONS.findIndex(l=>l.sec===sec.id);
    lesson={id:'skip',title:'跳站測驗',sec,upto,hearts:3};
    qs=shuffle(LESSONS.slice(0,upto).flatMap(l=>sample(l.build().filter(q=>q.type!=='match'&&q.type!=='speak'),2))).slice(0,15);
  }else if(id==='speaking'){
    lesson={id:'speaking',title:'口說練習'};
    let pool=LESSONS.filter(l=>S.done[l.id]);if(!pool.length)pool=[LESSONS[0]];
    const seen=new Set();qs=[];
    for(let t=0;t<30&&qs.length<8;t++){const l=pool[t%pool.length];l.build().filter(q=>q.type==='speak').forEach(q=>{if(!seen.has(q.speak)&&qs.length<8){seen.add(q.speak);qs.push(q)}})}
    qs=shuffle(qs);
  }else{lesson=LESSONS.find(l=>l.id===id);qs=lesson.build()}
  lesson=Object.assign({},lesson,{startId:id});
  if(!canSpeak)qs=qs.filter(q=>q.type!=='listen');
  if(id!=='speaking'&&!speakOn())qs=qs.filter(q=>q.type!=='speak');
  if(!qs.length)return;
  const mi=qs.findIndex(q=>q.type!=='match'&&q.type!=='speak');if((qs[0].type==='match'||qs[0].type==='speak')&&mi>0)[qs[0],qs[mi]]=[qs[mi],qs[0]];
  qs.forEach(q=>q.key=mkey(q));
  L={lesson,queue:qs,total:qs.length,correct:0,hearts:lesson.hearts||5,wrong:0,wrongKeys:new Set(),reviewKeys:new Set(qs.map(q=>q.key)),phase:'ask'};
  $('#home').hidden=true;$('#lesson').hidden=false;
  if(lesson.tip)renderTip();else renderQ();
}
function renderTip(){
  L.phase='tip';
  lessonShell(`<p class="prompt">本站重點：${L.lesson.title}</p><div class="tip">${L.lesson.tip}</div>`,
    `<button class="btn wide" id="btn-go">開始練習</button>`);
  $('#btn-go').onclick=renderQ;setTimeout(()=>$('#btn-go')?.focus(),30);
}

function lessonShell(body,foot){
  const pct=L.correct/L.total*100;
  $('#lesson').innerHTML=`
    <div class="l-head">
      <button class="x" id="btn-quit" aria-label="離開這一課">${IC.close}</button>
      <div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="${L.total}" aria-valuenow="${L.correct}"><i style="width:${pct}%"></i></div>
      <div class="hearts" title="剩下的愛心">${IC.heart}${L.hearts}</div>
    </div>
    <div class="l-body" id="l-body">${body}</div>
    <div class="l-foot" id="l-foot"><div class="l-foot-in" id="l-foot-in">${foot}</div></div>`;
  $('#btn-quit').onclick=askQuit;
}

function renderQ(){
  const q=L.queue[0];L.phase='ask';L.sel=null;L.picked=[];L.match={left:null,done:new Set()};
  let b=`<p class="prompt">${q.prompt}</p>`;
  const spkBtn=q.speak&&canSpeak?`<button class="spk" id="spk" aria-label="播放發音">${IC.speaker}</button>`:'';
  if(q.type==='speak'){
    b+=`<div class="show"><span class="${q.show.cls} jp">${q.show.html}</span>${spkBtn}${q.show.sub?`<span class="sub">${q.show.sub}</span>`:''}</div>
      <div class="mic-wrap"><button class="mic" id="mic" aria-label="開始說話">${IC.mic}</button><button class="btn ghost small" id="mic-test" type="button">🎙 錄音聽聽看</button><div class="lvl" id="lvl-wrap" aria-hidden="true" hidden><i id="mic-lvl"></i></div><div class="my-rec" id="my-rec" hidden></div>
      <p class="mic-status" id="mic-status">先按喇叭聽一次，再按麥克風唸出來</p></div>`;
  }
  if(q.type==='choice'||q.type==='type'){
    b+=`<div class="show"><span class="${q.show.cls} jp">${q.show.html}</span>${q.show.sub?'':spkBtn}${q.show.sub?`<span class="sub">${q.show.sub}</span>`:''}</div>`;
  }
  if(q.type==='listen'){
    b+=`<div class="show"><button class="spk big" id="spk" aria-label="播放發音">${IC.speaker}</button><button class="spk slow" id="spk-slow" aria-label="慢速播放">慢速</button></div>`;
  }
  if(q.type==='choice'||q.type==='listen'){
    const long=q.options.some(o=>o.replace(/<[^>]+>/g,'').length>8);
    b+=`<div class="opts${long?' one':''}">${q.options.map((o,i)=>`<button class="opt${q.jpOpts?' jp':''}" data-opt="${i}" aria-pressed="false"><span class="k">${i+1}</span><span class="t">${o}</span></button>`).join('')}</div>`;
  }
  if(q.type==='type'){
    b+=`<input class="answer-input" id="answer-input" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="例如：ka" aria-label="羅馬拼音">`;
  }
  if(q.type==='arrange'){
    b+=`<div class="bubble">${bot('')}<p>${q.zh}</p></div>
      <div class="tray" id="tray" aria-label="你的答案"></div>
      <div class="bank" id="bank">${q.bank.map((t,i)=>`<button class="tile" data-tile="${i}">${t}</button>`).join('')}</div>`;
  }
  if(q.type==='match'){
    const L1=shuffle(q.pairs.map((p,i)=>({i,t:p[0]}))), R1=shuffle(q.pairs.map((p,i)=>({i,t:p[1]})));
    b+=`<div class="match"><div class="col">${L1.map(x=>`<button class="opt jp" data-ml="${x.i}"><span class="t">${x.t}</span></button>`).join('')}</div>
      <div class="col">${R1.map(x=>`<button class="opt" data-mr="${x.i}"><span class="t">${x.t}</span></button>`).join('')}</div></div>`;
  }
  const foot=q.type==='match'?`<button class="btn wide ghost" disabled>配對完所有項目</button>`
    :q.type==='speak'?`<button class="btn wide ghost" id="btn-skip">現在不方便說話，跳過</button>`
    :`<button class="btn wide" id="btn-check" disabled>檢查</button>`;
  lessonShell(b,foot);
  const body=$('#l-body');
  const s=$('#spk');if(s)s.onclick=()=>speak(q.speak);
  const ss=$('#spk-slow');if(ss)ss.onclick=()=>speak(q.speak,.55);
  if(q.type==='listen'||(q.speak&&q.type==='choice'&&!q.show.sub))setTimeout(()=>speak(q.speak),250);
  body.querySelectorAll('[data-opt]').forEach(el=>el.onclick=()=>pickOpt(+el.dataset.opt));
  if(q.type==='type'){const inp=$('#answer-input');inp.oninput=()=>{$('#btn-check').disabled=!inp.value.trim()};setTimeout(()=>{if(inp.isConnected)inp.focus()},50)}
  if(q.type==='arrange'){body.querySelectorAll('[data-tile]').forEach(el=>el.onclick=()=>{const i=+el.dataset.tile;if(L.picked.includes(i))return;L.picked.push(i);drawTray()})}
  if(q.type==='match'){
    body.querySelectorAll('[data-ml]').forEach(el=>el.onclick=()=>{if(L.match.done.has(+el.dataset.ml))return;body.querySelectorAll('[data-ml]').forEach(x=>x.setAttribute('aria-pressed','false'));el.setAttribute('aria-pressed','true');L.match.left=+el.dataset.ml});
    body.querySelectorAll('[data-mr]').forEach(el=>el.onclick=()=>matchRight(el));
  }
  const c=$('#btn-check');if(c)c.onclick=check;
  if(q.type==='speak'){$('#mic').onclick=toggleMic;$('#mic-test').onclick=testMic;$('#btn-skip').onclick=skipSpeak}
}

/* ---------- speaking question ---------- */
let rec=null;
/* 「錄音聽聽看」：單獨開麥克風錄 5 秒（顯示音量條），錄完可以播放自己的錄音、跟標準發音對照；不跟語音辨識同時用 */
let meter=null,myRecUrl='';
function stopMeter(){
  if(!meter)return;const m=meter;meter=null;
  cancelAnimationFrame(m.raf);clearTimeout(m.t);
  if(m.mr&&m.mr.state!=='inactive'){m.discard=!m.finishing;try{m.mr.stop()}catch(e){}}
  m.st.getTracks().forEach(t=>t.stop());m.ac.close().catch(()=>{});
  const w=$('#lvl-wrap');if(w)w.hidden=true;
  const btn=$('#mic-test');if(btn)btn.textContent='🎙 錄音聽聽看';
}
async function testMic(){
  if(rec)return;
  if(meter){meter.finishing=true;stopMeter();return}
  const st=$('#mic-status'),w=$('#lvl-wrap'),bar=$('#mic-lvl'),btn=$('#mic-test'),box=$('#my-rec');
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    const ac=new (window.AudioContext||window.webkitAudioContext)(),an=ac.createAnalyser();an.fftSize=512;
    ac.createMediaStreamSource(stream).connect(an);
    const buf=new Uint8Array(an.fftSize);
    const m={st:stream,ac,raf:0,t:0,mr:null,peak:0,discard:false,finishing:false};meter=m;
    if(window.MediaRecorder){
      const chunks=[];const mr=new MediaRecorder(stream);m.mr=mr;
      mr.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
      mr.onstop=()=>{
        if(m.discard||!box||!box.isConnected)return;
        if(myRecUrl)URL.revokeObjectURL(myRecUrl);
        myRecUrl=URL.createObjectURL(new Blob(chunks,{type:mr.mimeType||'audio/webm'}));
        const q=L&&L.queue[0];
        box.hidden=false;
        box.innerHTML=`<div class="my-rec-row"><span>我的錄音</span><audio controls src="${myRecUrl}"></audio></div>`+
          (q&&q.speak&&canSpeak?`<button class="btn ghost small" id="std-play" type="button">🔊 聽標準發音對照</button>`:'');
        const sp=$('#std-play');if(sp)sp.onclick=()=>speak(q.speak);
        const a=box.querySelector('audio');try{a.play()}catch(e){}
      };
      mr.start();
    }
    w.hidden=false;btn.textContent='⏹ 停止錄音';
    st.textContent=m.mr?'錄音中…請唸出上面的日文（最長 5 秒，再按一次停止）':'說說看，音量條會跟著動（這個瀏覽器不支援錄音，只能看音量）';
    const tick=()=>{an.getByteTimeDomainData(buf);let x=0;for(const v of buf)x=Math.max(x,Math.abs(v-128));const lv=Math.min(1,x/48);m.peak=Math.max(m.peak,lv);bar.style.width=Math.round(lv*100)+'%';m.raf=requestAnimationFrame(tick)};tick();
    m.t=setTimeout(()=>{if(meter===m){m.finishing=true;stopMeter()}},5000);
    const done=()=>{const p=m.peak;st.textContent=(p>.5?'音量正常 👍':p>.12?'有收到聲音但偏小，請靠近一點':'幾乎沒收到聲音，請檢查 Mac「系統設定 → 聲音 → 輸入」')+(m.mr?' 聽聽看錄音：清楚的話是電腦辨識的問題；模糊或很小聲就是收音的問題。':'')};
    const wait=setInterval(()=>{if(meter!==m){clearInterval(wait);if(st.isConnected)done()}},100);
  }catch(e){st.textContent='無法使用麥克風：請允許瀏覽器使用麥克風（Claude 連結不能用麥克風）'}
}
function toggleMic(){
  if(!L||L.phase!=='ask')return;
  if(rec){try{rec.stop()}catch(e){};return}
  const q=L.queue[0], mic=$('#mic'), st=$('#mic-status');
  if(!canListen){st.textContent='這個瀏覽器不支援語音辨識，請用 Chrome 或 Safari 打開電腦裡的檔案。';return}
  stopMeter();
  mic.classList.add('on');mic.setAttribute('aria-label','停止');st.textContent='準備中…';
  const STAGE={audio:'🎙 開始收音了，請唸出上面的日文',sound:'🔊 聽到聲音了…',speech:'🗣 聽到說話了，辨識中…'};let stage='';
  rec=listen((t)=>{if(t)st.innerHTML=`正在聽…「<span class="jp">${furi(t)}</span>」`},(alts,err,info={})=>{
    rec=null;
    if(!L||L.queue[0]!==q||L.phase!=='ask')return;
    mic.classList.remove('on');mic.setAttribute('aria-label','開始說話');
    if(!alts.length){
      if(err==='not-allowed'||err==='service-not-allowed'){micBlocked=true}
      let msg=SR_ERR[err]||'沒有聽清楚，請再試一次。';
      if(info.metered&&!info.heardAny&&err!=='not-allowed'&&err!=='aborted')msg='麥克風完全沒收到聲音（音量條沒有動）。請到 Mac「系統設定 → 隱私權與安全性 → 麥克風」確認 Google Chrome 有打開，並在「系統設定 → 聲音 → 輸入」選對麥克風。';
      const how={'':'還沒開始收音','audio':'有收音、但沒聽到聲音','sound':'有聽到聲音、但沒認出是說話','speech':'有聽到說話、但沒辨識出文字'}[stage];
      st.textContent=msg+'（代碼：'+(err||'沒有結果')+'；進度：'+how+'）';return}
    const {score,pass,target,heard}=scoreSpeech(q,alts);
    const pct=Math.round(score*100);
    const diff=score<1&&target?`<div class="diff">標記的地方電腦聽到的不一樣：<span class="jp">${markDiff(target,heard)}</span></div>`:'';
    if(pass){showFeedback(true,{heard:alts[0],pct,diff});return}
    st.textContent='按麥克風再唸一次';sfx('no');
    $('#l-foot').className='l-foot no';
    $('#l-foot-in').innerHTML=`
      <div class="fb" role="status">${bot('sad')}
        <div><b>差一點，再試一次</b>
        <div class="ans">電腦聽到：「<span class="jp">${furi(alts[0])}</span>」・相似度 ${pct}%</div>
        ${diff}
        <small style="color:var(--muted)">正確是：<span class="jp">${q.answerHtml}</span>。口說題不會扣愛心。</small></div></div>
      <div style="display:flex;gap:10px"><button class="btn ghost" id="btn-skip" style="flex:1">跳過</button><button class="btn" id="btn-retry" style="flex:2">再唸一次</button></div>`;
    $('#btn-skip').onclick=skipSpeak;
    $('#btn-retry').onclick=()=>{$('#l-foot').className='l-foot';$('#l-foot-in').innerHTML=`<button class="btn wide ghost" id="btn-skip">現在不方便說話，跳過</button>`;$('#btn-skip').onclick=skipSpeak;toggleMic()};
  },null,sg=>{if(!stage||'audio sound speech'.indexOf(sg)>'audio sound speech'.indexOf(stage))stage=sg;if(st.isConnected&&!/「/.test(st.textContent))st.textContent=STAGE[stage]});
}
function skipSpeak(){
  if(!L||L.phase!=='ask')return;stopMeter();
  if(rec){try{rec.abort()}catch(e){};rec=null}
  L.queue.shift();L.correct++;next();
}

function pickOpt(i){
  if(L.phase!=='ask')return;
  L.sel=i;
  document.querySelectorAll('[data-opt]').forEach(el=>el.setAttribute('aria-pressed',+el.dataset.opt===i?'true':'false'));
  $('#btn-check').disabled=false;
}
function drawTray(){
  const q=L.queue[0];
  $('#tray').innerHTML=L.picked.map((i,n)=>`<button class="tile" data-back="${n}">${q.bank[i]}</button>`).join('');
  document.querySelectorAll('[data-tile]').forEach(el=>el.classList.toggle('used',L.picked.includes(+el.dataset.tile)));
  document.querySelectorAll('[data-back]').forEach(el=>el.onclick=()=>{if(L.phase!=='ask')return;L.picked.splice(+el.dataset.back,1);drawTray()});
  $('#btn-check').disabled=!L.picked.length;
}
function matchRight(el){
  if(L.phase!=='ask')return;
  const r=+el.dataset.mr;
  if(L.match.left===null||L.match.done.has(r))return;
  const lEl=document.querySelector(`[data-ml="${L.match.left}"]`);
  if(r===L.match.left){
    L.match.done.add(r);if(L.match.done.size<L.queue[0].pairs.length)sfx('pop');lEl.classList.add('done');el.classList.add('done');lEl.setAttribute('aria-pressed','false');lEl.disabled=el.disabled=true;
    L.match.left=null;
    if(L.match.done.size===L.queue[0].pairs.length)showFeedback(true);
  }else{
    [lEl,el].forEach(x=>{x.classList.remove('wrong');void x.offsetWidth;x.classList.add('wrong');setTimeout(()=>x.classList.remove('wrong'),600)});
  }
}

function check(){
  if(L.phase!=='ask')return;
  const q=L.queue[0];let ok=false;
  if(q.type==='choice'||q.type==='listen'){if(L.sel===null)return;ok=L.sel===q.answer}
  if(q.type==='type'){const v=$('#answer-input').value.trim().toLowerCase();if(!v)return;ok=q.accept.includes(v)}
  if(q.type==='arrange'){if(!L.picked.length)return;const got=L.picked.map(i=>q.bank[i]).join('');ok=(q.accept||[q.tokens.join('')]).includes(got);L.arranged=got}
  showFeedback(ok);
}

function showFeedback(ok,opts={}){
  const q=L.queue.shift();L.phase='fb';
  if(ok){L.correct++}
  else{
    L.hearts--;L.wrong++;L.wrongKeys.add(q.key);L.queue.push(q);
    if(!S.mistakes.some(m=>m.key===q.key)){S.mistakes.push(q);if(S.mistakes.length>30)S.mistakes.shift();save()}
  }
  let ans='';
  if(!ok){
    if(q.type==='choice'||q.type==='listen')ans=q.options[q.answer];
    else ans=q.answerHtml;
  }
  const praise=['答對了！','很好！','正確！','太棒了！'][Math.random()*4|0];
  const sayAfter=(q.type==='listen'||q.type==='arrange')&&q.speak?q.speak:(q.type==='arrange'?q.tokens.join(''):'');
  $('#l-foot').className='l-foot '+(ok?'ok':'no');
  $('#l-foot-in').innerHTML=`
    <div class="fb" role="status">${bot(ok?'happy':'sad')}
      <div><b>${ok?(opts.heard?(opts.pct>=100?'唸得很好！':'大致正確！'):praise):'差一點，正確答案是：'}</b>${ok?'':`<div class="ans"><span class="jp">${ans}</span></div>`}
      ${opts.heard?`<div class="ans">電腦聽到：「<span class="jp">${furi(opts.heard)}</span>」・相似度 ${opts.pct}%</div>${opts.diff||''}`:''}
      ${q.type==='arrange'&&q.altHtml&&q.altHtml.length?`<div class="ans">${ok?(L.arranged===q.tokens.join('')?'也可以說':'標準說法'):'也可以說'}：<span class="jp">${ok&&L.arranged!==q.tokens.join('')?q.answerHtml:q.altHtml[0]}</span></div>`:''}
      ${!ok?'<small style="color:var(--muted)">這題會在本課最後再出現一次。</small>':''}</div></div>
    <button class="btn wide${ok?'':' bad'}" id="btn-next">繼續</button>`;
  document.querySelectorAll('.opt,.tile,#answer-input').forEach(el=>{if(el.tagName==='INPUT')el.readOnly=true});
  $('.prog i').style.width=(L.correct/L.total*100)+'%';
  $('.hearts').innerHTML=IC.heart+L.hearts;
  sfx(ok?'ok':'no');
  if(sayAfter)setTimeout(()=>speak(sayAfter),350);
  const n=$('#btn-next');n.onclick=next;setTimeout(()=>{if(n.isConnected)n.focus()},30);
}

function next(){
  stopMeter();
  if(L.hearts<=0)return fail();
  if(!L.queue.length)return finish();
  renderQ();
}

function askQuit(){
  if($('#leave'))return;
  const box=document.createElement('div');box.className='leave';box.id='leave';
  box.innerHTML=`<span>現在離開，這一課的進度不會保存。</span><button class="btn ghost" id="stay">繼續學習</button><button class="btn bad" id="go">離開</button>`;
  $('#l-body').prepend(box);
  $('#stay').onclick=()=>box.remove();
  $('#go').onclick=goHome;
}
function goHome(){stopMeter();if(rec){try{rec.abort()}catch(e){};rec=null}if(canSpeak)try{speechSynthesis.cancel()}catch(e){};L=null;$('#lesson').hidden=true;$('#home').hidden=false;renderHome();window.scrollTo(0,0)}

function fail(){
  L.phase='end';
  $('#lesson').innerHTML=`<div class="l-body"><div class="result">
    <div class="bots">${bot('sad')}</div>
    <h2>愛心用完了</h2><p>沐沐：沒關係！答錯的題目已經存進錯題複習，休息一下再一起挑戰。</p>
    <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center">
      <button class="btn ghost" id="r-home">回到路線圖</button><button class="btn" id="r-retry">再挑戰一次</button></div>
  </div></div>`;
  const id=L.lesson.startId;sfx('lose');
  $('#r-home').onclick=goHome;$('#r-retry').onclick=()=>startLesson(id);
}

function finish(){
  L.phase='end';
  const perfect=L.wrong===0, isSkip=L.lesson.id==='skip', isTalk=L.lesson.id==='speaking';
  const isReview=L.lesson.id==='review'||isTalk;
  const gain=isSkip?20:isReview?5+(perfect?5:0):10+(perfect?5:0);
  const t=today();
  if(S.todayDate!==t){S.todayDate=t;S.todayXp=0}
  if(S.lastDay!==t){S.streak=S.lastDay===yesterday()?S.streak+1:1;S.lastDay=t}
  S.xp+=gain;S.todayXp+=gain;
  if(isTalk){}
  else if(isReview){S.mistakes=S.mistakes.filter(m=>!L.reviewKeys.has(m.key)||L.wrongKeys.has(m.key))}
  else if(isSkip){LESSONS.slice(0,L.lesson.upto).forEach(l=>{if(!S.done[l.id])S.done[l.id]={date:dateStr()}})}
  else if(!S.done[L.lesson.id]){S.done[L.lesson.id]={date:dateStr()}}
  save();
  const acc=Math.round(L.total/(L.total+L.wrong)*100);
  const stampHtml=isTalk?`<div class="big-stamp" style="--stamp:var(--n1)"><b>話</b><small>SPEAKING</small></div>`:isSkip?`<div class="big-stamp" style="--stamp:var(--n2)"><b>跳</b><small>SKIP</small></div>`:isReview?`<div class="big-stamp" style="--stamp:var(--n4)"><b>復</b><small>REVIEW</small></div>`
    :`<div class="big-stamp"><b>${L.lesson.stamp}</b><small>N5-${L.lesson.no}</small></div>`;
  $('#lesson').innerHTML=`<div class="l-body"><div class="result">
    <div class="bots">${stampHtml}${bot('happy')}</div>
    <h2>${isTalk?'口說練習完成！':isSkip?'跳站成功！':isReview?'複習完成！':'到站了！'}</h2>
    <p>沐沐：${isTalk?'多唸幾次，嘴巴會越來越習慣日文的節奏。':isSkip?`前面的站都幫你蓋好章了，直接從「${L.lesson.sec.name}」開始。`:isReview?'答錯的題目留在錯題本裡，答對的已經清掉。':perfect?'全部一次答對，多拿 5 XP。':'印章已經蓋進印章簿。'}</p>
    <div class="tiles">
      <div class="tile-stat"><small>獲得</small><b style="color:var(--gold)">+${gain} XP</b></div>
      <div class="tile-stat"><small>正確率</small><b style="color:var(--good)">${acc}%</b></div>
      <div class="tile-stat"><small>連續</small><b style="color:var(--n2)">${S.streak} 天</b></div>
    </div>
    <button class="btn wide" id="r-home" style="max-width:420px">回到路線圖</button>
  </div></div>`;
  $('#r-home').onclick=goHome;setTimeout(()=>$('#r-home')?.focus(),30);sfx('win');
}

/* ---------- keyboard ---------- */
document.addEventListener('keydown',e=>{
  if(!L)return;
  if(e.key==='Enter'){
    if(L.phase==='tip'){e.preventDefault();renderQ();return}
    if(L.phase==='fb'){e.preventDefault();next()}
    else if(L.phase==='ask'){const c=$('#btn-check');if(c&&!c.disabled){e.preventDefault();check()}}
    return;
  }
  if(L.phase==='ask'&&/^[1-4]$/.test(e.key)&&document.activeElement?.tagName!=='INPUT'){
    const q=L.queue[0];if(q.options&&+e.key<=q.options.length)pickOpt(+e.key-1);
  }
});

renderHome();
</script>
